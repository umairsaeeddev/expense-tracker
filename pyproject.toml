[project]
name = "expense-tracker"
version = "0.1.0"
description = "A command-line expense tracker that stores expenses in a JSON file"
readme = "README.md"
authors = [
    { name = "Umair Saeed", email = "mumairsaeed.dev@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.3",
]

[project.scripts]
expense-tracker = "expense_tracker.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
